name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel glib2-devel dbus-devel \
            gettext itstool desktop-file-utils appstream-glib

      - name: Configure meson
        run: meson setup build --wipe

      - name: Build
        run: ninja -C build

      - name: Install to verify
        run: ninja -C build install DESTDIR=${GITHUB_WORKSPACE}/install