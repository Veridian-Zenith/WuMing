name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel glib2-devel dbus-devel \
            gettext itstool desktop-file-utils appstream-glib

      - name: Configure meson
        run: meson setup build --wipe

      - name: Build dist
        run: meson dist -C build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/meson-dist/*.tar.*
          generate_notes: true