name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libdbus-1-dev gettext itstool desktop-file-utils

      - name: Configure meson
        run: meson setup build --wipe

      - name: Build dist
        run: meson dist -C build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/meson-dist/*.tar.*
          generate_notes: true